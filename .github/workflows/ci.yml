name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and repository hygiene
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Check patch hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'
      - name: Verify formatting of new Swift files
        run: ./scripts/verify-swift-format.sh
      - name: Test
        run: swift test --enable-code-coverage
      - name: Report code coverage
        run: |
          PROFILE="$(find .build -name default.profdata -print -quit)"
          CONFIGURATION_DIR="$(dirname "$(dirname "$PROFILE")")"
          TEST_BUNDLE="$(find "$CONFIGURATION_DIR" -maxdepth 1 -type d -name '*.xctest' -print -quit)"
          TEST_BINARY="$TEST_BUNDLE/Contents/MacOS/$(basename "$TEST_BUNDLE" .xctest)"
          xcrun llvm-cov report "$TEST_BINARY" \
            -instr-profile "$PROFILE" \
            -ignore-filename-regex='Tests/|DerivedSources/'
      - name: Verify website
        run: ./scripts/verify-website.sh

  package:
    name: Release build and package smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build and package
        env:
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
          PRESENCEFM_SIGNING_IDENTITY: "-"
        run: ./scripts/package-app.sh
      - name: Verify app bundle
        env:
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/verify-package.sh
      - name: Create and verify DMG
        run: |
          VERSION="$(<VERSION)"
          ./scripts/create-dmg.sh "$VERSION"
          hdiutil verify "PresenceFM-$VERSION.dmg"
