name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and repository hygiene
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check patch hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'
      - name: Test
        run: swift test

  package:
    name: Release build and package smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build and package
        env:
          PRESENCEFM_VERSION: 0.4.0
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
          PRESENCEFM_SIGNING_IDENTITY: "-"
        run: ./scripts/package-app.sh
      - name: Verify app bundle
        env:
          PRESENCEFM_VERSION: 0.4.0
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/verify-package.sh
      - name: Create and verify DMG
        run: |
          ./scripts/create-dmg.sh 0.4.0
          hdiutil verify PresenceFM-0.4.0.dmg
