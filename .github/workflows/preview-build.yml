name: Preview Build

on:
  push:
    branches:
      - 'preview/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build preview (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Show environment
        run: |
          sw_vers
          swift --version
          cat VERSION

      - name: Test
        run: swift test

      - name: Package app
        env:
          PRESENCEFM_VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('preview-{0}', github.run_number) }}
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
          PRESENCEFM_SIGNING_IDENTITY: "-"
          PRESENCEFM_SKIP_SIGNING: "0"
        run: ./scripts/package-app.sh

      - name: Create DMG
        env:
          PRESENCEFM_VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('preview-{0}', github.run_number) }}
        run: ./scripts/create-dmg.sh "${PRESENCEFM_VERSION}"

      - name: Upload preview DMG
        uses: actions/upload-artifact@v4
        with:
          name: preview-dmg
          path: |
            PresenceFM-*.dmg
            PresenceFM-*.sha256
          if-no-files-found: error
          retention-days: 14
