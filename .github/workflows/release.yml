name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(<VERSION)"
          if [[ "$TAG_VERSION" != "$SOURCE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match VERSION $SOURCE_VERSION" >&2
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Package app
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
          PRESENCEFM_SIGNING_IDENTITY: "-"
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}" ./scripts/package-app.sh
      - name: Verify app bundle
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}" ./scripts/verify-package.sh
      - name: Create DMG
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          ./scripts/create-dmg.sh "${PRESENCEFM_VERSION}"
      - name: Create checksum
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          shasum -a 256 "PresenceFM-${PRESENCEFM_VERSION}.dmg" > "PresenceFM-${PRESENCEFM_VERSION}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            PresenceFM-*.dmg
            PresenceFM-*.sha256
