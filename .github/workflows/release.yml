name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Package app
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
          PRESENCEFM_SIGNING_IDENTITY: "-"
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}" ./scripts/package-app.sh
      - name: Create release archive
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          # Resource-fork metadata is unnecessary for this bundle and otherwise
          # creates noisy AppleDouble entries in the downloadable archive.
          ditto -c -k --norsrc --keepParent PresenceFM.app "PresenceFM-${PRESENCEFM_VERSION}.zip"
      - name: Create checksum
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          shasum -a 256 "PresenceFM-${PRESENCEFM_VERSION}.zip" > "PresenceFM-${PRESENCEFM_VERSION}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            PresenceFM-*.zip
            PresenceFM-*.sha256
