name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Package app
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
          PRESENCEFM_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}" ./scripts/package-app.sh
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/presencefm-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Sign app
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements Distribution.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" PresenceFM.app
          codesign --verify --deep --strict --verbose=2 PresenceFM.app
      - name: Create release archive
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          ditto -c -k --keepParent PresenceFM.app "PresenceFM-${PRESENCEFM_VERSION}.zip"
      - name: Notarize and staple app
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          xcrun notarytool submit "PresenceFM-${PRESENCEFM_VERSION}.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple PresenceFM.app
          xcrun stapler validate PresenceFM.app
          rm "PresenceFM-${PRESENCEFM_VERSION}.zip"
          ditto -c -k --keepParent PresenceFM.app "PresenceFM-${PRESENCEFM_VERSION}.zip"
      - name: Create checksum
        env:
          PRESENCEFM_VERSION: ${{ github.ref_name }}
        run: |
          PRESENCEFM_VERSION="${PRESENCEFM_VERSION#v}"
          shasum -a 256 "PresenceFM-${PRESENCEFM_VERSION}.zip" > "PresenceFM-${PRESENCEFM_VERSION}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            PresenceFM-*.zip
            PresenceFM-*.sha256
