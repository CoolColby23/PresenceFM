name: Bug report
description: Report a reproducible PresenceFM problem
body:
  - type: input
    id: version
    attributes: { label: PresenceFM version }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes: { label: Redacted diagnostics, if relevant }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, secrets, and personal paths.
          required: true
