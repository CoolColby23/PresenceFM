name: Bug report
description: Report a reproducible PresenceFM problem
labels: ["Bug"]
body:
  - type: input
    id: version
    attributes: { label: PresenceFM version }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: If relevant, paste diagnostics after removing secrets and personal paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, secrets, and personal paths.
          required: true
