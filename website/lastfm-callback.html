<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; navigate-to presencefm:" />
    <title>Return to PresenceFM</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { align-items: center; background: #07142f; color: #f7f9ff; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      .disc { background: linear-gradient(135deg, #14d9ff, #1f66ff); border-radius: 50%; height: 5rem; margin: 0 auto 1.5rem; position: relative; width: 5rem; }
      .disc::after { background: #07142f; border-radius: 50%; content: ""; height: 1.25rem; left: 1.875rem; position: absolute; top: 1.875rem; width: 1.25rem; }
      h1 { font-size: 2rem; margin: 0 0 0.75rem; }
      p { color: #aeb9d4; line-height: 1.5; }
      a { background: #1f66ff; border-radius: 999px; color: white; display: inline-block; font-weight: 700; margin-top: 1rem; padding: 0.9rem 1.4rem; text-decoration: none; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="disc" aria-hidden="true"></div>
      <h1>Return to PresenceFM</h1>
      <p id="status">Authorization is complete. Returning you to the app…</p>
      <a id="open-app" href="presencefm://lastfm-auth" hidden>Open PresenceFM</a>
    </main>
    <script>
      const token = new URLSearchParams(window.location.search).get("token");
      const status = document.querySelector("#status");
      const link = document.querySelector("#open-app");

      if (token) {
        link.href = `presencefm://lastfm-auth?token=${encodeURIComponent(token)}`;
        link.hidden = false;
        window.location.replace(link.href);
      } else {
        status.textContent = "Last.fm did not provide an authorization token. Return to PresenceFM and try again.";
      }
    </script>
  </body>
</html>
